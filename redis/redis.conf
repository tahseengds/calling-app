# SECURITY NOTE: this instance has no authentication. It is only reachable on
# the internal app_network (production compose does NOT publish 6379 to the
# host). To add auth, set `requirepass <secret>` here AND update REDIS_URL /
# SIGNALING_REDIS_URL in .env to redis://:<secret>@redis:6379/N for every
# client (fastapi, worker, signaling) in the same change — do not enable
# `protected-mode yes` on its own, as with no password set it would reject the
# other containers' non-loopback connections and break the app.
#
# Also note docker-compose.dev.yml publishes 6379 to the host for convenience;
# do not use that override on a machine with an untrusted network.
maxmemory 256mb
maxmemory-policy allkeys-lru
save 900 1
save 300 10
appendonly yes
appendfsync everysec
