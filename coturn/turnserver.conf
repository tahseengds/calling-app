# =============================================================================
# Coturn TURN/STUN server configuration — Lumin
# =============================================================================
# Template: the install.sh script substitutes the three placeholders below
# before writing to /etc/turnserver.conf:
#   ${VPS_PUBLIC_IP}  — droplet's public IPv4 address
#   ${DOMAIN}         — your domain (e.g. lumin.example.com)
#   ${TURN_SECRET}    — must equal TURN_SECRET in .env (FastAPI reads same value)
#
# Auth mechanism: use-auth-secret (REST API / time-limited HMAC-SHA1).
# FastAPI's generate_turn_credentials() sets username="{expiry}:{userId}" and
# credential=base64(HMAC-SHA1(TURN_SECRET, username)).
# DO NOT also enable lt-cred-mech or add static user entries — the two
# mechanisms conflict and coturn will refuse to start.
# =============================================================================

# ── Network ───────────────────────────────────────────────────────────────────
listening-port=3478
tls-listening-port=5349
listening-ip=0.0.0.0

# On DigitalOcean with a single NIC the plain form is correct.
# On multi-NIC hosts use external-ip=<public>/<private> instead.
external-ip=${VPS_PUBLIC_IP}

# ── Realm / identity ─────────────────────────────────────────────────────────
realm=${DOMAIN}
server-name=${DOMAIN}

# ── Auth — time-limited HMAC credentials (REST API style, RFC 5389/8489) ─────
use-auth-secret
static-auth-secret=${TURN_SECRET}

# ── TLS — certs shared with Nginx / Let's Encrypt (created in prompt 10) ─────
# Run install.sh AFTER certbot has issued the certificate, or port 5349 will
# remain down until certs exist. Certbot's deploy hook (certbot-deploy-hook.sh)
# runs "systemctl reload coturn" so renewed certs are picked up without downtime.
cert=/etc/letsencrypt/live/${DOMAIN}/fullchain.pem
pkey=/etc/letsencrypt/live/${DOMAIN}/privkey.pem

# ── Relay port range (must be open in firewall — see firewall.sh) ─────────────
min-port=49152
max-port=65535

# ── Security hardening ────────────────────────────────────────────────────────
# Prevent relay to RFC-1918 / loopback / multicast addresses (SSRF mitigation).
no-multicast-peers
no-loopback-peers
no-cli
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=172.16.0.0-172.31.255.255

# Minimum TLS version — disable old vulnerable protocols.
no-tlsv1
no-tlsv1_1

# ── Quotas / capacity ─────────────────────────────────────────────────────────
total-quota=100
max-bps=1000000          # 1 Mbps per allocation

# ── Logging ───────────────────────────────────────────────────────────────────
log-file=/var/log/coturn/turnserver.log
simple-log
