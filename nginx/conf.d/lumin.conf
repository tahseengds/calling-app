upstream fastapi   { server fastapi:8000; }
upstream signaling { server signaling:8001; }

# ── HTTP — redirect everything to HTTPS (except ACME challenges) ────────────
server {
    listen 80;
    server_name lumin.tahseen.tech;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2  on;
    server_name lumin.tahseen.tech;

    ssl_certificate     /etc/letsencrypt/live/lumin.tahseen.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lumin.tahseen.tech/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    # Baseline security headers. These were previously only present in the
    # ssl.conf.template (applied on first cert issuance), so the committed
    # config that actually runs shipped without them.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # ACME challenge (in case of renewal while HTTPS is live)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Android App Link verification — Google's verifier fetches this file
    # at install time to confirm we own /auth/* on this host and may open
    # https://lumin.tahseen.tech/auth/verify-email links directly in the app.
    # Updating the SHA-256s? Edit nginx/conf.d/assetlinks.json then run
    # deploy/remote_deploy.py — it SFTPs the file and restarts nginx.
    location = /.well-known/assetlinks.json {
        alias /etc/nginx/conf.d/assetlinks.json;
        default_type application/json;
        add_header Cache-Control "public, max-age=600" always;
    }

    location = /health {
        proxy_pass       http://fastapi/health;
        proxy_set_header Host $host;
        # Overwrite any client-supplied X-Real-IP / X-Forwarded-For. The backend
        # gates the detailed (topology-revealing) health report on the caller
        # being internal, and it trusts these headers — so they must reflect the
        # real peer, not whatever the client sent.
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        access_log       off;
    }

    location /api/ {
        proxy_pass       http://fastapi/api/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Media uploads: backend caps at 150 MB for video (see MAX_VIDEO_SIZE_MB);
        # add headroom for multipart overhead. Default nginx limit is 1 MB.
        client_max_body_size 200M;
        client_body_timeout  120s;

        # Inline ffmpeg thumbnail / probe on large videos can take a while.
        proxy_read_timeout   300s;
        proxy_send_timeout   300s;
    }

    # Signed media
    location /media/ {
        auth_request /api/media/verify-signature;
        alias        /var/app-media/;
        gzip         off;
        add_header   Cache-Control "private, no-transform" always;
        # Never let a stored "document" be sniffed/rendered as active content
        # (e.g. an HTML file uploaded as text/plain). Force download and disable
        # MIME sniffing so it can't execute script on this origin.
        add_header   X-Content-Type-Options "nosniff" always;
        add_header   Content-Disposition "attachment" always;
    }

    location = /api/media/verify-signature {
        internal;
        proxy_pass              http://fastapi;
        proxy_pass_request_body off;
        proxy_set_header        Content-Length "";
        proxy_set_header        X-Original-URI    $request_uri;
        proxy_set_header        X-Forwarded-Proto $scheme;
    }

    # Signaling WebSocket
    location /signal {
        proxy_pass         http://signaling;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 300s;
        gzip               off;
    }
}
