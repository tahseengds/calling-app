services:
  postgres:
    image: postgres:15-alpine
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/api/db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network
    restart: always

  redis:
    image: redis:7-alpine
    command: redis-server /etc/redis/redis.conf
    volumes:
      - ./redis/redis.conf:/etc/redis/redis.conf:ro
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network
    restart: always

  fastapi:
    build: ./backend/api
    env_file: .env
    volumes:
      - media_storage:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"
    networks:
      - app_network
    restart: always

  worker:
    build: ./backend/api
    env_file: .env
    command: ["python", "-m", "app.workers.fcm_worker"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app_network
    restart: always

  signaling:
    build: ./backend/signaling
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    expose:
      - "8001"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8001/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    networks:
      - app_network
    restart: always

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
      - /var/app-media:/var/app-media:ro
    depends_on:
      - fastapi
      - signaling
    networks:
      - app_network
    restart: always

  # ── Monitoring ──────────────────────────────────────────────────────────────
  # Prometheus scrapes the API's /metrics directly over app_network (see
  # monitoring/prometheus.yml). It never goes through nginx, so the API's
  # internal-IP gate accepts it on the container's Docker address. Both the
  # Prometheus and Grafana UIs are bound to 127.0.0.1 only — reach them via an
  # SSH tunnel (ssh -L 9090:localhost:9090 / -L 3000:localhost:3000), never the
  # public internet.
  prometheus:
    # Pinned for reproducible deploys (remote_deploy.py re-pulls on every run).
    image: prom/prometheus:v2.55.1
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - app_network
    restart: always

  grafana:
    image: grafana/grafana:11.3.0
    depends_on:
      - prometheus
    environment:
      # Set GRAFANA_ADMIN_PASSWORD in .env. Defaults to admin/admin (Grafana
      # forces a password change on first login).
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - app_network
    restart: always

networks:
  app_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  # In production, override media_storage with a bind mount to /var/app-media
  # via a docker-compose.prod.yml so Nginx can serve files directly.
  media_storage:
  prometheus_data:
  grafana_data:
