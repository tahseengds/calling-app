apiVersion: 1

# Load any dashboard JSON dropped into /var/lib/grafana/dashboards (mounted
# from ./monitoring/grafana/dashboards in docker-compose).
providers:
  - name: lumin
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
