name: flutter_app
description: FamilyLink — private family communication app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.0
  riverpod_annotation: ^2.3.0

  # Networking
  dio: ^5.4.0
  web_socket_channel: ^2.4.0
  socket_io_client: ^2.0.3
  connectivity_plus: ^6.0.0

  # WebRTC — added in prompt 15 (calling feature) with a Flutter-3.x-compatible version.
  # flutter_webrtc: ^0.10.0  ← 0.10.x references removed PluginRegistry.Registrar

  # Firebase / FCM
  firebase_core: ^3.0.0
  firebase_messaging: ^15.0.0

  # Local database (Drift + SQLite)
  drift: ^2.16.0
  drift_flutter: ^0.2.0
  sqlite3_flutter_libs: ^0.5.0

  # Background services & notifications
  flutter_background_service: ^5.0.0
  flutter_local_notifications: ^17.0.0

  # Media
  image_picker: ^1.0.7
  file_picker: ^8.0.0
  flutter_sound: ^9.4.0
  video_player: ^2.8.0
  photo_view: ^0.14.0
  cached_network_image: ^3.3.0

  # Storage
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.0
  path_provider: ^2.1.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.3.0
  permission_handler: ^11.3.0

  # Routing
  go_router: ^14.0.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.0
  drift_dev: ^2.16.0
  riverpod_generator: ^2.3.0

flutter:
  uses-material-design: true
