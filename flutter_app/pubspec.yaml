name: flutter_app
description: Lumio — private chat and calling app.
publish_to: 'none'
version: 1.0.0+2002

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.3.1
  # riverpod_annotation and the explicit riverpod pin removed — all providers
  # are hand-written (no @riverpod codegen), and flutter_riverpod already
  # brings the riverpod package transitively.

  # Networking
  dio: ^5.9.2
  web_socket_channel: ^3.0.3
  socket_io_client: ^3.1.4
  connectivity_plus: ^7.1.1

  # WebRTC — added in prompt 15 (calling feature) with a Flutter-3.x-compatible version.
  # flutter_webrtc: ^0.10.0  ← 0.10.x references removed PluginRegistry.Registrar

  # Firebase / FCM / Auth (Google + Email/Password)
  firebase_core: ^4.9.0
  firebase_messaging: ^16.2.2
  firebase_auth: ^6.1.1
  # Google Sign-In — runs the native Google account picker then exchanges
  # the result for a Firebase credential via GoogleAuthProvider.credential.
  google_sign_in: ^6.2.2

  # Local database (Drift + SQLite)
  drift: ^2.31.0
  drift_flutter: ^0.3.0
  sqlite3_flutter_libs: ^0.6.0+eol

  # Background services & notifications
  flutter_background_service: ^5.1.0
  flutter_local_notifications: ^21.0.0

  # Media
  image_picker: ^1.2.2
  image_cropper: ^9.0.0
  flutter_image_compress: ^2.3.0
  file_picker: ^12.0.0-beta.4
  flutter_sound: ^9.30.0
  video_player: ^2.11.1
  photo_view: ^0.15.0
  cached_network_image: ^3.4.1
  # audio_session: subscribe to OS audio interruptions (incoming cellular
  # call, Siri, alarm) so an active call can pause/resume cleanly.
  audio_session: ^0.2.3

  # Storage
  flutter_secure_storage: ^10.3.0
  shared_preferences: ^2.5.5
  path_provider: ^2.1.5

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.3
  permission_handler: ^12.0.1

  # QR friend-adding — camera scanning + branded QR generation (rounded
  # modules + centered app logo) + sharing the code as an image.
  mobile_scanner: ^7.2.0
  qr_flutter: ^4.1.0
  share_plus: ^13.1.0

  # Full searchable emoji keyboard for composing messages.
  emoji_picker_flutter: ^4.3.0

  # WebRTC — flutter_webrtc 0.11+ uses Flutter plugin v2 API (no PluginRegistry.Registrar)
  flutter_webrtc: ^0.13.0

  # Wakelock — keeps the screen on during active calls
  wakelock_plus: ^1.2.0

  # Routing
  go_router: ^17.2.3

  cupertino_icons: ^1.0.8
  # Lucide icon set — crisper, consistent line icons (bottom nav, QR feature).
  lucide_icons_flutter: ^3.1.14+2
  google_fonts: ^8.1.0
  # Runtime splash control (preserve/remove APIs used in main.dart).
  flutter_native_splash: ^2.4.0

  # Settings sub-screens (notifications, sounds, privacy, help, about)
  package_info_plus: ^10.1.0
  url_launcher: ^6.3.1
  audioplayers: ^6.1.0
  local_auth: ^2.3.0

  # Email-verification deep links (replaces deprecated firebase_dynamic_links).
  app_links: ^6.3.2

  # Opens the user's default mail client at the INBOX, not at compose
  # (mailto: would open compose). Android-only intent wrapper.
  android_intent_plus: ^5.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  drift_dev: ^2.31.0
  # riverpod_generator removed — no @riverpod annotations exist in the codebase;
  # all providers are declared explicitly. Removing it breaks the analyzer version
  # conflict with riverpod 3.x + web_socket_channel 3.x + flutter_test SDK pins.
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/sounds/notifications/

  # ── OPTIONAL: bundled emoji font ──────────────────────────────────────────
  # The code references a 'NotoColorEmoji' fontFamilyFallback so the newest
  # Unicode emoji render everywhere instead of as ▯. It is OPT-IN so the build
  # never fails on a missing file. To enable it:
  #   1. download the font into flutter_app/assets/fonts/NotoColorEmoji.ttf
  #        (small COLRv1 ~1.5MB:  noto-emoji/fonts/Noto-COLRv1.ttf
  #         full bitmap ~10MB:    noto-emoji/fonts/NotoColorEmoji.ttf)
  #   2. uncomment the block below, then `flutter pub get`.
  # (Unregistered fallback is harmless — Flutter just skips it.)
  # fonts:
  #   - family: NotoColorEmoji
  #     fonts:
  #       - asset: assets/fonts/NotoColorEmoji.ttf

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/lumin-logo.png"

flutter_native_splash:
  color: "#F4F6FB"
  color_dark: "#1A2235"
  image: "assets/lumin-splash-screen.png"
  android_12:
    image: "assets/lumin-splash-screen.png"
    icon_background_color: "#F4F6FB"
    icon_background_color_dark: "#1A2235"
